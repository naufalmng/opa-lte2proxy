# OPA-LTE2PROXY configuration
# Lokasi: /etc/opa-lte2proxy.conf (atau local opa-lte2proxy.conf)
# Format: KEY=VALUE (baris kosong & komentar # diabaikan)

# Address & Port SOCKS5 Server
LISTEN_ADDR=127.0.0.1:10800

# IP Outbound Egress (IP interface modem di server)
EGRESS_IP=192.168.200.174

# Interface modem (untuk routing & failover guard)
MODEM_IFACE=enx0202025b3531

# Gateway modem
MODEM_GW=192.168.200.1

# REST API Control Server
API_ADDR=127.0.0.1:10808

# Serial ID ADB Modem (kosongkan untuk auto-detect)
ADB_SERIAL=2285100c

# Auto-rotate timer dalam menit (0 = disabled / on-demand)
AUTO_ROTATE_MINS=0

# Auto-rotate setiap N request SOCKS5 selesai (0 = disabled)
ROTATE_EVERY_REQS=0
